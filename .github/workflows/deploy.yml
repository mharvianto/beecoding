name: Build & release

# Build dilakukan di runner GitHub karena server produksi (1 GB RAM) tidak kuat build
# frontend. Hasilnya diunggah sebagai GitHub Release; server mengambil release terbaru
# lewat ~/deploy-beecoding.sh (dijalankan beecoding-deploy.timer setiap 2 menit).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ASSET: beecoding-linux-arm64.tar.gz
  ASSET_X64: beecoding-linux-x64.tar.gz

jobs:
  build:
    # A manual run from another branch must not publish a release the server then deploys.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # A real PostgreSQL for the second test run below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # A real Redis for the shared-state tests (throttles, job claims) of the multi-instance setup.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BeeCoding/ClientApp/package-lock.json

      # Plain-JS logic of the SPA (src/lib): drafts, i18n, the synced-preference list vs the server's, the modal helper.
      - name: Test (frontend)
        working-directory: BeeCoding/ClientApp
        run: npm ci && npm test

      # The server deploys whatever the newest release holds, within minutes and with its migrations: a red test must stop it here.
      - name: Test
        env:
          BEECODING_TEST_REDIS: localhost:6379
        run: dotnet test BeeCoding.Tests -c Release

      # The same suite on PostgreSQL (each test gets a database of its own and applies the Postgres migrations): keeps that provider
      # working while production still runs SQLite, and fails when a model change got a migration for only one of the two.
      - name: Test (PostgreSQL)
        env:
          BEECODING_TEST_PG: Host=localhost;Port=5432;Username=postgres
        run: dotnet test BeeCoding.Tests -c Release --no-build

      # A few browser flows against the real app (login, a modal's keyboard behaviour, page titles, joining a board) on a throw-away database.
      - name: Test (browser)
        working-directory: BeeCoding/ClientApp
        run: npm run build && npx playwright install --with-deps chromium && npm run test:e2e

      - name: Publish (linux-arm64)
        env:
          VITE_BASE_PATH: /beecoding/
        run: dotnet publish BeeCoding/BeeCoding.csproj -c Release -r linux-arm64 --self-contained false -o out

      # Frontend sudah dibangun oleh publish di atas, jadi npm tidak dijalankan lagi.
      - name: Publish (linux-x64)
        run: dotnet publish BeeCoding/BeeCoding.csproj -c Release -r linux-x64 --self-contained false -p:BuildClient=false -o out-x64

      - name: Package
        run: |
          tar -czf "$ASSET" -C out .
          sha256sum "$ASSET" > "$ASSET.sha256"
          tar -czf "$ASSET_X64" -C out-x64 .
          sha256sum "$ASSET_X64" > "$ASSET_X64.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git log -1 --format='Commit %H%n%n%s' > notes.txt
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET_X64" "$ASSET_X64.sha256" \
            --title "$TAG" --notes-file notes.txt --target "$GITHUB_SHA" --latest

      - name: Delete old releases (keep 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
