name: Build & release

# Build dilakukan di runner GitHub karena server produksi (1 GB RAM) tidak kuat build
# frontend. Hasilnya diunggah sebagai GitHub Release; server mengambil release terbaru
# lewat ~/deploy-beecoding.sh (dijalankan beecoding-deploy.timer setiap 2 menit).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ASSET: beecoding-linux-arm64.tar.gz
  ASSET_X64: beecoding-linux-x64.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BeeCoding/ClientApp/package-lock.json

      - name: Publish (linux-arm64)
        env:
          VITE_BASE_PATH: /beecoding/
        run: dotnet publish BeeCoding/BeeCoding.csproj -c Release -r linux-arm64 --self-contained false -o out

      # Frontend sudah dibangun oleh publish di atas, jadi npm tidak dijalankan lagi.
      - name: Publish (linux-x64)
        run: dotnet publish BeeCoding/BeeCoding.csproj -c Release -r linux-x64 --self-contained false -p:BuildClient=false -o out-x64

      - name: Package
        run: |
          tar -czf "$ASSET" -C out .
          sha256sum "$ASSET" > "$ASSET.sha256"
          tar -czf "$ASSET_X64" -C out-x64 .
          sha256sum "$ASSET_X64" > "$ASSET_X64.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          git log -1 --format='Commit %H%n%n%s' > notes.txt
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET_X64" "$ASSET_X64.sha256" \
            --title "$TAG" --notes-file notes.txt --target "$GITHUB_SHA" --latest

      - name: Delete old releases (keep 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
